[project]
name = "phonon-speech-demo"
version = "0.1.0"
description = "Local text-to-speech with Gradium's Phonon on Ollama: speak, stream, read Markdown aloud, benchmark, and a web page. No runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gopal Saini" }]
dependencies = []

[project.scripts]
phonon-demo = "phonon_demo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonon_demo"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×"]  # "40× real time"

[tool.ruff.lint.isort]
known-first-party = ["phonon_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
