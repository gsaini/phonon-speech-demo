name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv publishes exact version tags only
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Phonon needs Apple Silicon, so CI talks to the fake Ollama in tests/conftest.py instead.
      - run: uv run pytest -q
      - run: uv run phonon-demo read README.md --show > /dev/null
